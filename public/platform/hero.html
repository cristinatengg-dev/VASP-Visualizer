 precision highp float;

 float box(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.))+min(max(q.x,max(q.y,q.z)),0.);}

 float atoms(vec3 p){float a=.61;vec3 q=mod(p+a*.5,a)-a*.5;vec3 q1=mod(p-vec3(0.,a*.5,a*.5)+a*.5,a)-a*.5;vec3 q2=mod(p-vec3(a*.5,0.,a*.5)+a*.5,a)-a*.5;vec3 q3=mod(p-vec3(a*.5,a*.5,0.)+a*.5,a)-a*.5;float d=min(min(length(q),length(q1)),min(length(q2),length(q3)))-.102;return max(d,box(p,vec3(1.035)));}

 float testRig(vec3 p){float w=.135+.23*smoothstep(.40,.94,abs(p.x));float specimen=roundBox(p,vec3(1.12,w,.045),.035);float jaws=roundBox(vec3(abs(p.x)-1.36,p.y,p.z),vec3(.25,.33,.22),.06);float rails=capsule(p,vec3(-1.8,-.43,-.24),vec3(1.8,-.43,-.24),.05);float probe=capsule(p,vec3(0.,.75,-.25),vec3(0.,.40,-.10),.04);float head=roundBox(p-vec3(0.,.87,-.30),vec3(.14,.14,.16),.04);return min(min(specimen,jaws),min(rails,min(probe,head)));}
