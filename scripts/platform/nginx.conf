limit_req_zone $binary_remote_addr zone=platform_api:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=platform_connections:10m;
limit_req_status 429;
limit_conn_status 429;

server {
    listen 80;
    server_name scivisualizer.com www.scivisualizer.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name scivisualizer.com www.scivisualizer.com;
    ssl_certificate /etc/nginx/ssl/scivisualizer.com.crt;
    ssl_certificate_key /etc/nginx/ssl/scivisualizer.com.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 26m;
    client_body_timeout 60s;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy same-origin always;

    location /api/ {
        limit_req zone=platform_api burst=30 nodelay;
        limit_conn platform_connections 8;
        proxy_pass http://platform:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_request_buffering off;
        proxy_cache off;
        gzip off;
        add_header X-Accel-Buffering no always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    location / {
        proxy_pass http://platform:3000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
    }
}
